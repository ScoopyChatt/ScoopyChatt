[build]
builder = "nixpacks"

[deploy]
startCommand = "set -e; : \"${PB_SUPERUSER_EMAIL:?PB_SUPERUSER_EMAIL is not set on this service}\"; : \"${PB_SUPERUSER_PASSWORD:?PB_SUPERUSER_PASSWORD is not set on this service}\"; curl -fsSL https://github.com/pocketbase/pocketbase/releases/download/v0.38.0/pocketbase_0.38.0_linux_amd64.zip -o /tmp/pb.zip && unzip -o -q /tmp/pb.zip pocketbase && chmod +x pocketbase && ./pocketbase superuser upsert \"$PB_SUPERUSER_EMAIL\" \"$PB_SUPERUSER_PASSWORD\" && ./pocketbase serve --http=0.0.0.0:$PORT --dir=./pb_data"
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3
